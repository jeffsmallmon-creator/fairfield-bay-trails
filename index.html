<header>
<h2>Fairfield Bay Yellow Trail</h2>
<div>Interactive GPS Trail Map</div>
</header>
<main>
<div class="controls">
<button id="start" class="primary">Start GPS</button>
<button id="stop">Stop GPS</button>
<button id="follow">Follow Me: ON</button>
<button id="fit">Show Entire Trail</button>
</div>
<p id="status">GPS is off. Press Start GPS.</p>
<div id="map"></div>
<p class="note">Yellow lines show the Google My Maps trail route. The blue dot shows your current position. GPS accuracy varies. Stay on designated trails and follow posted signs.</p>

const status = document.getElementById("status");

const map = L.map("map").setView([35.633,-92.275],14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const trails=L.featureGroup().addTo(map);

trailData.forEach((coords,i)=>{
 L.polyline(coords,{
  color:"#342800",weight:9,opacity:.85
 }).addTo(trails);
 L.polyline(coords,{
  color:"#ffdd16",weight:6,opacity:1
 }).bindPopup("Yellow Trail - Section "+(i+1)).addTo(trails);
});

const start=[35.6277691,-92.2666839];
L.marker(start).bindPopup("Yellow Trail Starting Point").addTo(trails);

const bounds=trails.getBounds();
map.fitBounds(bounds.pad(.12));

let watchId=null;
let marker=null;
let circle=null;
let following=true;
let lastPosition=null;

function gpsUpdate(p){
 const ll=[p.coords.latitude,p.coords.longitude];
 lastPosition=ll;
 const accuracy=p.coords.accuracy;
 if(!marker){
  marker=L.marker(ll,{
   icon:L.divIcon({
    className:"",
    html:'<div class="gps-marker"></div>',
    iconSize:[20,20],
    iconAnchor:[10,10]
   })
  }).addTo(map);
  circle=L.circle(ll,{radius:accuracy,color:"#1686e2",fillOpacity:.08}).addTo(map);
 }else{
  marker.setLatLng(ll);
  circle.setLatLng(ll).setRadius(accuracy);
 }
 if(following)map.setView(ll,Math.max(map.getZoom(),16));
 status.textContent="GPS active. Accuracy approximately "+Math.round(accuracy)+" meters.";
}

function gpsError(e){
 status.textContent="GPS error: "+e.message+
 ". Check location permissions for the published website.";
}

document.getElementById("start").onclick=()=>{
 if(!navigator.geolocation){
  status.textContent="GPS is not supported in this browser.";
  return;
 }
 if(watchId!==null)return;
 status.textContent="Requesting GPS location...";
 watchId=navigator.geolocation.watchPosition(gpsUpdate,gpsError,{
  enableHighAccuracy:true,
  maximumAge:1000,
  timeout:20000
 });
};

document.getElementById("stop").onclick=()=>{
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=null;
 status.textContent="GPS stopped.";
};

document.getElementById("follow").onclick=()=>{
 following=!following;
 document.getElementById("follow").textContent=
 "Follow Me: "+(following?"ON":"OFF");
 if(following&&lastPosition)map.setView(lastPosition,Math.max(map.getZoom(),16));
};

document.getElementById("fit").onclick=()=>{
 following=false;
 document.getElementById("follow").textContent="Follow Me: OFF";
 map.fitBounds(bounds.pad(.12));
};

map.on("dragstart",()=>{
 following=false;
 document.getElementById("follow").textContent="Follow Me: OFF";
});

setTimeout(()=>map.invalidateSize(),300);
</script>
