
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fairfield Bay Yellow Trail GPS</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
 margin:0;
 height:100%;
 font-family:Arial,sans-serif;
}
#map {
 width:100%;
 height:100%;
}
.header {
 position:absolute;
 top:12px;
 left:50%;
 transform:translateX(-50%);
 z-index:1000;
 background:white;
 padding:12px 18px;
 border-radius:10px;
 text-align:center;
 box-shadow:0 2px 8px #0004;
 width:max-content;
 max-width:85%;
}
.header strong {
 display:block;
 font-size:17px;
}
.header small {
 font-size:12px;
}
.controls {
 position:absolute;
 bottom:25px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:8px;
 z-index:1000;
}
button {
 padding:12px;
 background:#1268ac;
 border:0;
 border-radius:8px;
 color:white;
 font-size:14px;
 font-weight:bold;
}
#status {
 position:absolute;
 bottom:85px;
 left:50%;
 transform:translateX(-50%);
 z-index:1000;
 background:white;
 padding:9px 12px;
 border-radius:8px;
 box-shadow:0 1px 6px #0003;
 font-size:12px;
 text-align:center;
 width:max-content;
 max-width:85%;
}
.gps-dot {
 width:16px;
 height:16px;
 background:#1683ff;
 border:3px solid white;
 border-radius:50%;
 box-shadow:0 0 0 5px #1683ff44;
}
</style>
</head>

<body>

<div class="header">
<strong>Fairfield Bay Yellow Trail</strong>
<small>Live GPS Trail Navigation</small>
</div>

<div id="map"></div>
<div id="status">Loading Yellow Trail...</div>

<div class="controls">
<button onclick="centerOnRider()">📍 My Location</button>
<button id="followButton" onclick="toggleFollow()">
Follow: ON
</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

<script>
const start = [35.627783, -92.266711];
const map = L.map('map').setView(start,14);

L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  attribution:'&copy; OpenStreetMap contributors',
  maxZoom:19
 }
).addTo(map);

let riderLocation=null;
let riderMarker=null;
let accuracyCircle=null;
let followRider=true;

const statusBox=document.getElementById('status');

function status(message) {
 statusBox.textContent=message;
}

// Draw yellow routes from any valid KML file.
function drawKML(text) {
 const xml=new DOMParser().parseFromString(
  text,'application/xml'
 );

 if(xml.querySelector('parsererror')) {
  throw new Error('Invalid KML');
 }

 const geojson=toGeoJSON.kml(xml);

 const layer=L.geoJSON(geojson,{
  style:{
   color:'#FFD400',
   weight:7,
   opacity:1
  },
  pointToLayer:function(feature,latlng) {
   return L.circleMarker(latlng,{
    radius:5,
    color:'#333',
    weight:2,
    fillColor:'#FFD400',
    fillOpacity:1
   });
  },
  onEachFeature:function(feature,layer) {
   if(feature.properties?.name) {
    layer.bindPopup(feature.properties.name);
   }
  }
 }).addTo(map);

 if(layer.getBounds().isValid()) {
  map.fitBounds(layer.getBounds(),{
   padding:[35,35]
  });
  status('Yellow Trail loaded. GPS starting...');
  return true;
 }

 return false;
}

// First try the standard KML filename.
// If missing, look for KML files through GitHub.
async function loadTrail() {
 try {
  const response=await fetch(
   './trail.kml?cache='+Date.now()
  );

  if(response.ok) {
   const text=await response.text();
   if(drawKML(text)) return;
  }
 } catch(e) {
  console.log('Checking other KML files');
 }

 try {
  const host=location.hostname;
  const match=host.match(/^(.+)\.github\.io$/);

  if(!match) {
   throw new Error('Not hosted on GitHub Pages');
  }

  const owner=match[1];
  const path=location.pathname.split('/')
   .filter(Boolean);
  const repo=path.length ? path[0] : owner+'.github.io';
  const folder=path.slice(1,-1).join('/');

  const api='https://api.github.com/repos/'+
   encodeURIComponent(owner)+'/'+
   encodeURIComponent(repo)+'/contents/'+
   folder;

  const response=await fetch(api);

  if(!response.ok) {
   throw new Error('GitHub file list unavailable');
  }

  const files=await response.json();
  const kmlFiles=files.filter(file=>
   file.type==='file' &&
   file.name.toLowerCase().endsWith('.kml')
  );

  if(!kmlFiles.length) {
   throw new Error('No KML files found');
  }

  let loaded=0;

  for(const file of kmlFiles) {
   try {
    const kmlResponse=await fetch(
     file.download_url
    );
    if(!kmlResponse.ok) continue;

    const text=await kmlResponse.text();
    if(drawKML(text)) loaded++;
   } catch(error) {
    console.error(file.name,error);
   }
  }

  if(!loaded) {
   throw new Error('KML files have no readable route');
  }

  status('Yellow Trail loaded. GPS starting...');

 } catch(error) {
  console.error(error);
  status('Trail not found. Rename your KML file to trail.kml');
 }
}

function startGPS() {
 if(!navigator.geolocation) {
  status('GPS not supported by this browser');
  return;
 }

 navigator.geolocation.watchPosition(
  position=>{
   const lat=position.coords.latitude;
   const lng=position.coords.longitude;
   const accuracy=position.coords.accuracy;

   riderLocation=[lat,lng];

   if(!riderMarker) {
    const icon=L.divIcon({
     className:'',
     html:'<div class="gps-dot"></div>',
     iconSize:[22,22],
     iconAnchor:[11,11]
    });

    riderMarker=L.marker(riderLocation,{
     icon:icon,
     zIndexOffset:1000
    }).addTo(map);

    riderMarker.bindPopup('You are here');
   } else {
    riderMarker.setLatLng(riderLocation);
   }

   if(!accuracyCircle) {
    accuracyCircle=L.circle(riderLocation,{
     radius:accuracy,
     color:'#1683ff',
     weight:1,
     fillColor:'#1683ff',
     fillOpacity:0.1,
     interactive:false
    }).addTo(map);
   } else {
    accuracyCircle.setLatLng(riderLocation);
    accuracyCircle.setRadius(accuracy);
   }

   if(followRider) {
    map.panTo(riderLocation);
   }

   status('GPS active • Accuracy: '+
    Math.round(accuracy)+' meters');
  },

  error=>{
   if(error.code===1) {
    status('Allow location access to use GPS');
   } else {
    status('Waiting for GPS signal...');
   }
  },

  {
   enableHighAccuracy:true,
   maximumAge:0,
   timeout:15000
  }
 );
}

function centerOnRider() {
 if(riderLocation) {
  map.setView(riderLocation,17);
 } else {
  status('Waiting for GPS location');
 }
}

function toggleFollow() {
 followRider=!followRider;

 document.getElementById('followButton').textContent=
  followRider?'Follow: ON':'Follow: OFF';

 if(followRider && riderLocation) {
  map.panTo(riderLocation);
 }
}

// Load map and start GPS.
loadTrail();
startGPS();
</script>
</body>
</html>
