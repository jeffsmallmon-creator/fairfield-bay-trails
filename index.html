
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Fairfield Bay Yellow Trail GPS Map</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0004;
      text-align: center;
      width: max-content;
      max-width: 80%;
    }

    .header strong {
      display: block;
      font-size: 16px;
    }

    .header small {
      font-size: 12px;
    }

    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 8px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 8px 12px;
      background: white;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      box-shadow: 0 1px 6px #0003;
      max-width: 85%;
    }

    .gps-dot {
      width: 16px;
      height: 16px;
      background: #1683ff;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 3px #1683ff55;
    }
  </style>
</head>

<body>

  <div class="header">
    <strong>Fairfield Bay Yellow Trail</strong>
    <small>Live GPS Trail Navigation</small>
  </div>

  <div id="map"></div>

  <div id="status">Loading trail map...</div>

  <div class="controls">
    <button onclick="centerOnRider()">
      📍 My Location
    </button>

    <button onclick="toggleFollow()" id="followButton">
      Follow: ON
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

  <script>
    // Fairfield Bay Yellow Trail starting area
    const trailStart = [35.627783, -92.266711];

    const map = L.map('map').setView(trailStart, 14);

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }
    ).addTo(map);

    const statusBox = document.getElementById('status');

    let riderMarker = null;
    let accuracyCircle = null;
    let riderLocation = null;
    let followRider = true;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    // Load the updated trail exported from Google My Maps.
    // The KML must be uploaded to this same GitHub folder.
    fetch('./trail.kml')
      .then(response => {
        if (!response.ok) {
          throw new Error('trail.kml could not be found');
        }
        return response.text();
      })
      .then(kmlText => {
        const parser = new DOMParser();
        const kml = parser.parseFromString(
          kmlText,
          'application/xml'
        );

        if (kml.querySelector('parsererror')) {
          throw new Error('Invalid KML file');
        }

        const geojson = toGeoJSON.kml(kml);

        const trailLayer = L.geoJSON(geojson, {
          style: {
            color: '#FFD400',
            weight: 7,
            opacity: 0.95
          },
          pointToLayer: function(feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 6,
              color: '#333333',
              weight: 2,
              fillColor: '#FFD400',
              fillOpacity: 1
            });
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties &&
                feature.properties.name) {
              layer.bindPopup(feature.properties.name);
            }
          }
        }).addTo(map);

        if (trailLayer.getBounds().isValid()) {
          map.fitBounds(trailLayer.getBounds(), {
            padding: [30, 30]
          });
        }

        setStatus('Trail loaded. Enable GPS to follow your ride.');
        startGPS();
      })
      .catch(error => {
        console.error(error);
        setStatus('Trail file not loaded. Check trail.kml.');
        startGPS();
      });

    // Live location tracking
    function startGPS() {
      if (!navigator.geolocation) {
        setStatus('GPS is not supported by this browser.');
        return;
      }

      navigator.geolocation.watchPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          riderLocation = [latitude, longitude];

          if (!riderMarker) {
            const gpsIcon = L.divIcon({
              className: '',
              html: '<div class="gps-dot"></div>',
              iconSize: [22, 22],
              iconAnchor: [11, 11]
            });

            riderMarker = L.marker(riderLocation, {
              icon: gpsIcon,
              zIndexOffset: 1000
            }).addTo(map);

            riderMarker.bindPopup('You are here');
          } else {
            riderMarker.setLatLng(riderLocation);
          }

          if (!accuracyCircle) {
            accuracyCircle = L.circle(riderLocation, {
              radius: accuracy,
              color: '#1683ff',
              weight: 1,
              fillColor: '#1683ff',
              fillOpacity: 0.10,
              interactive: false
            }).addTo(map);
          } else {
            accuracyCircle.setLatLng(riderLocation);
            accuracyCircle.setRadius(accuracy);
          }

          if (followRider) {
            map.panTo(riderLocation, {
              animate: true
            });
          }

          setStatus(
            'GPS active • Accuracy: ' +
            Math.round(accuracy) + ' meters'
          );
        },

        function(error) {
          let message = 'Unable to obtain GPS location.';

          if (error.code === 1) {
            message = 'Please allow location access in your browser.';
          } else if (error.code === 2) {
            message = 'GPS location is temporarily unavailable.';
          } else if (error.code === 3) {
            message = 'GPS timed out. Trying again.';
          }

          setStatus(message);
        },

        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );
    }

    function centerOnRider() {
      if (riderLocation) {
        map.setView(riderLocation, 17);
      } else {
        setStatus('Waiting for your GPS location.');
      }
    }

    function toggleFollow() {
      followRider = !followRider;

      document.getElementById('followButton').textContent =
        followRider ? 'Follow: ON' : 'Follow: OFF';

      if (followRider && riderLocation) {
        map.panTo(riderLocation);
      }
    }
  </script>
</body>
</html>
